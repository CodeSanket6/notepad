app-id: io.github.CodeSanket6.notepad
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: notepad

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.FileManager1

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man

modules:
  - name: notepad
    buildsystem: meson
    sources:
      - type: dir
        path: .
